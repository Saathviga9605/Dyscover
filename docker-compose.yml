version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dyscover
      POSTGRES_USER: dyscover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyscover -d dyscover"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dyscover-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dyscover:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dyscover
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-changeme}
      CORS_ORIGINS: http://localhost,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - dyscover-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dyscover-network

volumes:
  postgres_data:

networks:
  dyscover-network:
    driver: bridge