# Production-style local deployment: PostgreSQL + migrations + API + nginx/SPA.
# Copy .env.example to .env and set real secrets first. TLS must be terminated
# in front of the "web" service for any non-local deployment.
name: dyscover

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dyscover
      POSTGRES_USER: dyscover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyscover -d dyscover"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  # One-shot schema migration; the API refuses to start unless the schema is at head.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://dyscover:${POSTGRES_PASSWORD}@postgres:5432/dyscover
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    # No published port: only reachable through the web proxy.

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
